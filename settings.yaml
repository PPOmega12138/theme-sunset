apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-sunset-setting
spec:
  forms:
    - group: appearance
      label: "主题"
      formSchema:
        - $formkit: radio
          name: color_scheme
          label: "默认配色"
          value: system
          options:
            - label: "跟随系统"
              value: system
            - label: "明亮"
              value: light
            - label: "深色"
              value: dark
        - $formkit: color
          name: main_color
          label: "主题色"
          value: "#ffb0fa"
        - $formkit: color
          name: accent_color
          label: "强调色"
          value: "#c43d83"

    - group: index
      label: "首页设置"
      formSchema:
        - $formkit: attachment
          name: background_image
          label: "首页背景图"
          accepts: 
            - image/*
          help: "建议使用横向图片，宽度至少1920px"

        - $formkit: attachment
          name: welcome_image
          label: 首页欢迎图片
          accepts:
            - image/*
          help: 建议使用横向图片或正方形图片

        - $formkit: text
          name: welcome_content_1
          label: 欢迎语第一行
          value: ""
          placeholder: 写点东西

        - $formkit: text
          name: welcome_content_2
          label: 欢迎语第二行
          value: ""
          placeholder: 留给未来的自己

        - $formkit: text
          name: motto
          label: 首页一句话
          value: ""
    
    - group: photos
      label: "图库设置"
      formSchema:
        - $formkit: number
          name: page_size
          label: "每页图片数量"
          value: 30
          min: 1
          max: 100
        - $formkit: number
          name: columns
          label: "图片列数"
          value: 5
          max: 10
          min: 2
          help: "仅影响1100px以上的宽屏"
        - $formkit: text
          name: immich_url
          label: "Immich地址"
          placeholder: "https://photos.example.com/s/example"
          help: "若要接入Immich图库请填写Immich共享图库地址，并使用自定义页面模板Immich。Immich服务器需要允许跨域访问"

    - group: background
      label: "背景图"
      formSchema:
        - $formkit: attachment
          name: archive_bgimg
          label: "归档页背景图"
          accepts: 
            - image/*
        - $formkit: attachment
          name: categories_bgimg
          label: "分类页背景图"
          accepts:
            - image/*
        - $formkit: attachment
          name: tags_bgimg
          label: "标签页背景图"
          accepts:
            - image/*
        - $formkit: attachment
          name: moments_bgimg
          label: "动态（瞬间）页背景图"
          accepts:
            - image/*
        - $formkit: attachment
          name: photos_bgimg
          label: "图库页背景图"
          accepts:
            - image/*
        - $formkit: attachment
          name: links_bgimg
          label: "友链页背景图"
          help: "此处设置/links页背景图，主题提供的自定义友链页采用页面封面图作为背景"
          accepts:
            - image/*

    - group: footer
      label: "页脚设置"
      formSchema:
        - $formkit: text
          name: icp
          label: "ICP备案号，若留空则不显示"
          value: ""
          placeholder: 京ICP备12345678号

        - $formkit: text
          name: public_security
          label: "公安备案号，若留空则不显示"
          value: ""
          placeholder: 京公网安备11010802000001号


