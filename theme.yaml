apiVersion: theme.halo.run/v1alpha1
kind: Theme
metadata:
  name: theme-sunset
spec:
  displayName: Sunset
  author:
    name: Your Name
    website: https://github.com/YourName
  description: A starter theme for Halo.
  logo: /themes/theme-sunset/assets/icon.svg
  homepage: https://github.com/halo-sigs/theme-astro-starter
  issues: https://github.com/halo-sigs/theme-astro-starter/issues
  settingName: theme-sunset-setting
  configMapName: theme-sunset-configMap
  version: "1.0.0"
  requires: ">=2.0.0"
  license:
    - name: "GPL-3.0"
      url: "https://www.gnu.org/licenses/gpl-3.0.en.html"
  customTemplates:
    page:
      - name: link
        description: 友链页模板
        file: link.html
      - name: immich
        description: Immich 图库页模板
        file: immich.html